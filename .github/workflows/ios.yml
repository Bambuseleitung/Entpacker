name: Entpacker (IPA)

# Von Hand starten: GitHub → Reiter „Actions“ → „Entpacker (IPA)“ → „Run workflow“.
# Ergebnis: eine ungesignierte IPA (Artefakt „Entpacker-ipa“) für Sideloadly oder AltStore.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Xcode wählen
        run: |
          newest=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$newest" ]; then sudo xcode-select -s "$newest"; fi
          xcodebuild -version

      - name: Projekt erzeugen (XcodeGen) und Pods laden
        run: |
          brew install xcodegen
          xcodegen generate
          pod install

      - name: VLCKit-Header ausgeben
        run: |
          for f in VLCMediaThumbnailer.h VLCMediaPlayer.h; do
            F=$(find Pods -name "$f" | head -1)
            out=$(grep -E '^(@property|@interface|@protocol|- ?\(|\+ ?\()' "$F" | grep -iE 'thumbnail|snapshot|position|rate|jump|mute|length|seekable|drawable|videoout|videosize|state|delegate|isplaying|crop|aspect|scale|initwith|fetch|cancel|library' | head -70)
            msg=$( { echo "== $f ($F)"; echo "$out"; } | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::notice::${msg:0:60000}"
          done

      - name: Systembibliotheken prüfen (libarchive)
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          { echo "SDK=$SDK"; ls "$SDK"/usr/include/archive*.h "$SDK"/usr/lib/libarchive* 2>&1; } | while IFS= read -r l; do echo "::notice::$l"; done

      - name: App bauen (ohne Signatur)
        run: |
          set -o pipefail
          xcodebuild -workspace Entpacker.xcworkspace -scheme Entpacker -configuration Release -sdk iphoneos             -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Entpacker.xcarchive"             CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""             archive 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Fehlerzeilen als Hinweise ausgeben
        if: failure()
        run: |
          grep -E "error:|fatal error|ld: " "$RUNNER_TEMP/build.log" | sort -u | head -15 | while IFS= read -r l; do echo "::error::${l:0:900}"; done

      - name: IPA packen
        run: |
          mkdir -p Payload
          cp -R "$RUNNER_TEMP/Entpacker.xcarchive/Products/Applications/Entpacker.app" Payload/
          zip -qry Entpacker.ipa Payload
          ls -lh Entpacker.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Entpacker-ipa
          path: Entpacker.ipa
          retention-days: 14
