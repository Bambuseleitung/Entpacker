name: Entpacker
options:
  bundleIdPrefix: com.adasells
  deploymentTarget:
    iOS: "16.0"
packages:
  SWCompression:
    url: https://github.com/tsolomko/SWCompression.git
    exactVersion: 4.8.7 # 4.9+ verlangt iOS 17
targets:
  Entpacker:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: SWCompression
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adasells.entpacker
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Entpacker
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDocumentTypes:
          - CFBundleTypeName: Alle Dateien
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.data]
